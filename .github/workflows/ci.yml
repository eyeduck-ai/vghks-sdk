name: SDK checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python run_tests.py
      - run: python -m ruff check .
      - run: python tools/generate_api_reference.py --check
      - run: python tools/check_public_tree.py --staged
      - run: python -m build --outdir output/package
      - name: Check distribution contents
        shell: bash
        run: |
          for artifact in output/package/*; do
            python tools/check_public_tree.py --archive "$artifact"
          done
